name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Build Copilot VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out "repoanalyzer-copilot-${{ steps.version.outputs.version }}.vsix"

      - name: Build Antigravity skill archive
        shell: bash
        run: |
          mkdir -p release/antigravity
          cp -R plugins/repo-analyze/skills/repo-analyze release/antigravity/repo-analyze
          (cd release/antigravity && zip -r "../../repoanalyzer-antigravity-${{ steps.version.outputs.version }}.zip" repo-analyze)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            repoanalyzer-copilot-${{ steps.version.outputs.version }}.vsix
            repoanalyzer-antigravity-${{ steps.version.outputs.version }}.zip
