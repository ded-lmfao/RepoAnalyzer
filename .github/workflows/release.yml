name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Create version tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build Copilot VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out "repoanalyzer-copilot-${{ steps.version.outputs.version }}.vsix"

      - name: Build Antigravity skill archive
        shell: bash
        run: |
          mkdir -p release/antigravity
          cp -R plugins/repo-analyze/skills/repo-analyze release/antigravity/repo-analyze
          (cd release/antigravity && zip -r "../../repoanalyzer-antigravity-${{ steps.version.outputs.version }}.zip" repo-analyze)

      - name: Publish GitHub Release
        if: steps.tag.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            repoanalyzer-copilot-${{ steps.version.outputs.version }}.vsix
            repoanalyzer-antigravity-${{ steps.version.outputs.version }}.zip
